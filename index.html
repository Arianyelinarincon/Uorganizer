 <button class="btn dg" data-a="logout">Cerrar sesión</button><div style="height:10px"></div><button class="btn ghost" data-a="delAcc">Eliminar cuenta y datos</button>`}

/* ---------- pantallas completas ---------- */
function openSheet(k,h){if(!kind){try{history.pushState({s:1},'')}catch(_){}}kind=k;$('#sheet').innerHTML=h;$('#sheet').hidden=false;$('#sheet').scrollTop=0}
function reset(){$('#sheet').hidden=true;$('#sheet').innerHTML='';kind=null;F=null;N=null}
function closeSheet(){if(!kind)return;if(history.state&&history.state.s)history.back();else reset()}
addEventListener('popstate',()=>{if(kind)reset()});
const pgTop=(t,i,r='')=>`<div class="top"><button class="ib" data-a="closeSheet">${ic(i)}</button><b>${t}</b><span class="tr">${r}</span></div>`;
const tools=`<div class="tb" onmousedown="event.preventDefault()"><button data-a="fmt" data-v="bold"><b>B</b></button><button data-a="fmt" data-v="italic"><i>I</i></button><button data-a="fmt" data-v="underline"><u>U</u></button><button data-a="fmt" data-v="insertUnorderedList">•</button></div>`;
const picker=`<div class="mb"><button data-a="pick" data-v="img">${ic('img')}Imagen</button><button data-a="pick" data-v="vid">${ic('vid')}Video</button><button data-a="pick" data-v="cam">${ic('cam')}Foto</button><button data-a="pick" data-v="file">${ic('file')}Archivo</button></div>`;
function mediaGrid(ms,ed){return ms.length?`<div class="mg">${ms.map(m=>{const u=urlOf(m),x=ed?`<button class="rm" data-a="rmMedia" data-id="${m.id}">${ic('x')}</button>`:'';
 return m.kind==='img'?`<div class="mi" data-a="view" data-id="${m.id}"><img src="${u}" alt="">${x}</div>`:m.kind==='vid'?`<div class="mi" data-a="view" data-id="${m.id}"><video src="${u}#t=0.1" preload="metadata" muted></video><em>▶</em>${x}</div>`:`<div class="mi fl"><a href="${u}" target="_blank" rel="noopener">${ic('file')}<span>${esc(m.name)}</span></a>${x}</div>`}).join('')}</div>`:'<p class="mu sm">Aún no hay archivos.</p>'}
const subs=()=>[...new Set([...me().subjects,F.subj].filter(x=>x&&x!=='__new'))];
const subjH=()=>subs().map(s=>`<button class="chp${F.subj===s?' on':''}" data-a="setSubj" data-v="${esc(s)}">${esc(s)}</button>`).join('')+`<button class="chp${F.subj==='__new'?' on':''}" data-a="setSubj" data-v="__new">${ic('plus')}Otra</button>`;
const typeH=()=>Object.entries(TY).map(([k,[l,i]])=>`<button class="chp${F.type===k?' on':''}" data-a="setType" data-v="${k}">${ic(i)}${l}</button>`).join('');
const tagsH=()=>F.tags.map((t,i)=>`<span class="chp">${esc(t)}<a data-a="rmTag" data-v="${i}">${ic('x')}</a></span>`).join('');
function taskForm(){return `<div class="pn">${pgTop(F.id?'Editar tarea':'Nueva tarea','x')}<div id="bn"></div>
 <label>Título<input data-f="title" value="${esc(F.title)}" placeholder="¿Qué tienes que hacer?"></label>
 <div class="lb2">Materia</div><div class="chips wrap" id="sj">${subjH()}</div><input class="fi" id="sn" data-f="newSubj" placeholder="Nombre de la materia o actividad" ${F.subj==='__new'?'':'hidden'}>
 <div class="lb2">Tipo</div><div class="chips wrap" id="ty">${typeH()}</div>
 <div class="lb2">Fecha límite</div><input class="fi" type="date" id="due" data-f="due" value="${F.due}"><div class="chips" style="margin-top:10px">${chip('qd','0','Hoy')}${chip('qd','1','Mañana')}${chip('qd','7','En 1 semana')}${chip('qd','14','En 2 semanas')}</div>
 <div class="lb2 row">Dificultad <b id="dv" class="mu sm">${dvT(F.diff)}</b></div><input class="fi" type="range" min="1" max="10" data-f="diff" value="${F.diff}">
 <div class="lb2">Color</div><div class="sw" id="cs">${sws(F.color,'col',TC)}</div>
 <div class="lb2">¿Qué hay que hacer?</div>${tools}<div class="ed" id="ed" contenteditable="true" data-ph="Describe la tarea: qué entregar, requisitos, indicaciones…">${F.desc}</div>
 <div class="lb2">Archivos de la tarea</div>${picker}<div id="mp">${mediaGrid(F.media,true)}</div>
 <div class="lb2">Etiquetas</div><div class="sr" style="margin-top:0"><input id="tagIn" placeholder="Añadir etiqueta"><button class="ib2" data-a="addTag">${ic('plus')}</button></div><div class="chips wrap" id="tg">${tagsH()}</div>
 <div class="sb"><button class="btn" data-a="saveTask">Guardar tarea</button></div></div>`}
function updBanner(){const el=$('#bn');if(!el||!F)return;if(!F.due){el.innerHTML='';return}const t={due:F.due,diff:+F.diff,done:false},p=prio(t),d=days(t);
 el.innerHTML=`<div class="bn" style="--p:var(--${p})">${ic(PI[p])}<div><b>Prioridad ${PL[p]}</b><small>${d<0?'La fecha ya pasó':d===0?'Vence hoy':d===1?'Vence mañana':d+' días restantes'}</small></div></div>`}
function detailV(t){const ns=S.notes.filter(n=>n.taskId===t.id&&n.uid===S.session),p=prio(t),d=days(t),c=t.done?'Esta tarea ya está lista':d<0?'La fecha ya pasó':d===0?'Vence hoy':d===1?'Vence mañana':`Faltan ${d} días`;
 return `<div class="pn">${pgTop('Tarea','back',`<button class="ib" data-a="shareOpen" data-id="${t.id}" data-v="task">${ic('friends')}</button><button class="ib" data-a="editTask" data-id="${t.id}">${ic('edit')}</button><button class="ib dgi" data-a="delTask" data-id="${t.id}">${ic('trash')}</button>`)}
 <div class="bn" style="--p:var(--${p})">${ic(t.done?'check':PI[p])}<div><b>${t.done?'Completada':'Prioridad '+PL[p]}</b><small>${c}</small></div></div>
 <h1 class="dt">${esc(t.title)}</h1>
 <div class="chips wrap"><span class="chp">${ic(TY[t.type][1])}${TY[t.type][0]}</span><span class="chp">${esc(t.subj)}</span>${t.tags.map(x=>`<span class="chp">${ic('tag')}${esc(x)}</span>`).join('')}</div>
 <div class="g2"><div class="tile">${ic('cal')}<small>Fecha límite</small><b>${fmt(t.due,{day:'numeric',month:'short'})}</b></div><div class="tile">${ic('bars')}<small>Dificultad</small><b>${t.diff}/10</b></div></div>
 ${t.desc?`<h3 class="sec">Qué hay que hacer</h3><div class="rt">${t.desc}</div>`:''}${t.media.length?`<h3 class="sec">Archivos de la tarea</h3>${mediaGrid(t.media,false)}`:''}
 <div style="margin:22px 0"><button class="btn" data-a="doneTask" data-id="${t.id}">${t.done?'Marcar como pendiente':'Marcar como completada'}</button></div>
 <div class="row"><h3>Apuntes (${ns.length})</h3><button class="sm2" data-a="newNote" data-id="${t.id}">${ic('plus')}Agregar apunte</button></div>
 ${ns.map(noteRow).join('')||empty('notes','Aún no hay apuntes. Agrega material nuevo cuando lo recibas, como un PDF o una foto.')}</div>`}
function noteForm(){const u=me(),T=mine('tasks');
 return `<div class="pn">${pgTop(N.id?'Editar apunte':'Nuevo apunte','x',N.id?`<button class="ib" data-a="shareOpen" data-id="${N.id}" data-v="note">${ic('friends')}</button>`:'')}<label>Título<input data-f="title" value="${esc(N.title)}" placeholder="Ej: Guía del profesor"></label>
 <label>Relacionar con una tarea<select data-f="taskId"><option value="">Sin relación</option>${T.map(t=>`<option value="${t.id}" ${t.id===N.taskId?'selected':''}>${esc(t.title)} (${esc(t.subj)})</option>`).join('')}</select></label>
 <label id="ns" ${N.taskId?'hidden':''}>Materia<select data-f="subj"><option value="">General</option>${u.subjects.map(s=>`<option ${s===N.subj?'selected':''}>${esc(s)}</option>`).join('')}</select></label>
 <div class="lb2">Contenido</div>${tools}<div class="ed" id="ed" contenteditable="true" data-ph="Escribe tu apunte…">${N.body}</div>
 <div class="lb2">Archivos adjuntos</div>${picker}<div id="mp">${mediaGrid(N.media,true)}</div>
 <div class="sb"><button class="btn" data-a="saveNote">Guardar apunte</button>${N.id?`<div style="height:10px"></div><button class="btn dg" data-a="delNote" data-id="${N.id}">Eliminar apunte</button>`:''}</div></div>`}

/* ---------- acciones ---------- */
const D=()=>kind==='note'?N:F,dm=()=>(D()||{}).media||[];
const A={
 tab:(_,v)=>{closeSheet();tab=v;if(v==='friends')loadFr();render();scrollTo(0,0)},
 theme:()=>{S.theme=isDark()?'light':'dark';apply();save();render();refPop()},
 goTheme:()=>{$('#pop').innerHTML=popH();$('#pop').hidden=false},closePop:()=>{$('#pop').hidden=true},
 setRemind:(_,v)=>{me().remind=+v;save();render()},
 delAcc:async()=>{if(!confirm('Se borrará tu cuenta y todos tus datos en la nube y en este dispositivo. No se puede deshacer. ¿Continuar?'))return;try{const b=sb.storage.from('files'),l=await b.list(S.session,{limit:1000});if(l.data&&l.data.length)await b.remove(l.data.map(x=>S.session+'/'+x.name));const r=await sb.rpc('delete_me');if(r.error)throw r.error;await sb.auth.signOut();wipe();toast('Cuenta eliminada')}catch(e){toast('No se pudo eliminar: '+em(e))}},
 setTheme:(_,v)=>{S.theme=v;apply();save();render();refPop()},
 acc:(_,v)=>{S.accent=v;apply();save();render();refPop()},
 col:(_,v)=>{F.color=v;$('#cs').innerHTML=sws(v,'col',TC)},
 closeSheet,lbx:()=>{$('#lb').hidden=true;$('#lb').innerHTML=''},
 qa:(_,v)=>{$('#ae').value=v;$('#ap').focus()},am:(_,v)=>{am=v;render()},
 auth:async()=>{if(!sb)return toast('Falta conectar el servidor');const e=($('#ae')?.value||'').trim().toLowerCase(),p=$('#ap')?.value||'',ok=/^\S+@\S+\.\S+$/;
  if(am==='forgot'){if(!ok.test(e))return toast('Escribe un correo válido');const r=await sb.auth.resetPasswordForEmail(e,{redirectTo:WEB_URL||location.origin+location.pathname});return toast(r.error?em(r.error):'Te enviamos un enlace a tu correo')}
  if(am==='recover'){if(p.length<6)return toast('La contraseña necesita al menos 6 caracteres');const r=await sb.auth.updateUser({password:p});if(r.error)return toast(em(r.error));history.replaceState(null,'',location.pathname);am='login';toast('Contraseña cambiada');return setUser(r.data.user)}
  if(am==='login'){const r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error)return toast(em(r.error));return setUser(r.data.user)}
  const n=$('#an').value.trim();if(!n)return toast('Escribe tu nombre de usuario');if(!ok.test(e))return toast('Escribe un correo válido');if(p.length<6)return toast('La contraseña necesita al menos 6 caracteres');
  const subjects=[...new Set($('#as').value.split(',').map(x=>x.trim()).filter(Boolean))],r=await sb.auth.signUp({email:e,password:p,options:{data:{name:n,subjects},emailRedirectTo:WEB_URL||location.origin+location.pathname}});
  if(r.error)return toast(em(r.error));if(!r.data.session){am='login';render();return toast('Revisa tu correo para confirmar la cuenta')}return setUser(r.data.user)},
 copyCode:()=>{navigator.clipboard&&navigator.clipboard.writeText(FR.code||'');toast('Código copiado')},
 addFr:async()=>{const c=($('#fc2').value||'').trim().toUpperCase();if(!c)return toast('Escribe el código');const p=await sb.rpc('find_by_code',{c}),x=p.data&&p.data[0];if(!x)return toast('No encontramos ese código');if(x.id===S.session)return toast('Ese es tu propio código');const r=await sb.from('friends').insert({a:S.session,b:x.id});toast(r.error?'Ya existe una solicitud con esa persona':'Solicitud enviada a '+x.name);loadFr()},
 accFr:async id=>{await sb.from('friends').update({status:'ok'}).eq('id',id);loadFr()},
 delFr:async id=>{if(!confirm('¿Continuar?'))return;await sb.from('friends').delete().eq('id',id);loadFr()},
 shareOpen:(id,v)=>{shT={k:v,id};$('#pop').innerHTML=`<div><div class="row" style="margin-bottom:8px"><h2>Compartir con…</h2><button class="ib" data-a="closePop">${ic('x')}</button></div>${FR.f.map(f=>`<button class="btn ghost" style="margin-bottom:8px" data-a="doShare" data-id="${f.uid}">${esc(f.name)}</button>`).join('')||'<p class="mu">Aún no tienes amigas. Agrégalas en la pestaña Amigas.</p>'}<p class="mu sm">Se envía una copia del texto. Los archivos adjuntos no se comparten.</p></div>`;$('#pop').hidden=false},
 doShare:async id=>{const t=shT.k==='task',o=(t?S.tasks:S.notes).find(x=>x.id===shT.id);if(!o)return;const item=t?{title:o.title,subj:o.subj,type:o.type,due:o.due,diff:o.diff,color:o.color,desc:o.desc,tags:o.tags}:{title:o.title,subj:o.subj,body:o.body},r=await sb.from('shares').insert({owner:S.session,to_uid:id,kind:shT.k,item});$('#pop').hidden=true;toast(r.error?'No se pudo compartir':'Compartido')},
 addSh:id=>{const x=FR.sh.find(q=>String(q.id)===String(id));if(!x)return;const u=me(),i=x.item;if(x.kind==='task'){if(i.subj&&!u.subjects.includes(i.subj))u.subjects.push(i.subj);S.tasks.push({id:uid(),uid:S.session,done:false,media:[],tags:[],...i})}else S.notes.push({id:uid(),uid:S.session,taskId:'',media:[],...i});save();A.dropSh(id);toast('Agregado a tu agenda')},
 dropSh:async id=>{await sb.from('shares').delete().eq('id',id);loadFr()},
 logout:async()=>{if(S.dirty)await push();if(sb)await sb.auth.signOut();wipe()},
 calToggle:()=>{cal.month=!cal.month;render()},calToday:()=>{cal.ref=today();render()},
 calPrev:()=>{cal.ref=cal.month?new Date(cal.ref.getFullYear(),cal.ref.getMonth()-1,1):addD(cal.ref,-7);render()},
 calNext:()=>{cal.ref=cal.month?new Date(cal.ref.getFullYear(),cal.ref.getMonth()+1,1):addD(cal.ref,7);render()},
 day:(_,k)=>{selDay=selDay===k?null:k;render()},
 filM:(_,v)=>{fil.m=v;render()},filP:(_,v)=>{fil.p=v;render()},nmF:(_,v)=>{nm=v;render()},
 newTask:()=>{F={title:'',subj:'',type:'tarea',due:fd(addD(today(),7)),diff:5,color:TC[0],desc:'',media:[],tags:[]};openSheet('task',taskForm());updBanner()},
 editTask:id=>{const t=S.tasks.find(x=>x.id===id);F={...t,media:[...t.media],tags:[...t.tags]};openSheet('task',taskForm());updBanner()},
 setSubj:(_,v)=>{F.subj=v;$('#sj').innerHTML=subjH();$('#sn').hidden=v!=='__new';if(v==='__new')$('#sn').focus()},
 setType:(_,v)=>{F.type=v;$('#ty').innerHTML=typeH()},
 qd:(_,v)=>{F.due=fd(addD(today(),+v));$('#due').value=F.due;updBanner()},
 openTask:id=>openSheet('detail',detailV(S.tasks.find(x=>x.id===id))),
 doneTask:id=>{const t=S.tasks.find(x=>x.id===id);t.done=!t.done;save();closeSheet();render()},
 delTask:id=>{if(!confirm('¿Eliminar esta tarea y todos sus apuntes?'))return;S.tasks=S.tasks.filter(t=>t.id!==id);S.notes=S.notes.filter(n=>n.taskId!==id);save();closeSheet();render();toast('Tarea eliminada')},
 saveTask:()=>{const u=me();let s=F.subj==='__new'?(F.newSubj||'').trim():F.subj;
  if(!F.title.trim())return toast('Escribe un título');if(!s)return toast('Elige una materia');if(!F.due)return toast('Elige una fecha límite');
  if(!u.subjects.includes(s))u.subjects.push(s);
  const d={title:F.title.trim(),subj:s,type:F.type,due:F.due,diff:+F.diff,color:F.color,desc:F.desc,media:F.media,tags:F.tags};
  if(F.id)Object.assign(S.tasks.find(x=>x.id===F.id),d);else S.tasks.push({id:uid(),uid:S.session,done:false,...d});
  save();closeSheet();render();toast('Tarea guardada')},
 newNote:id=>{const t=typeof id==='string'&&S.tasks.find(x=>x.id===id);N={title:'',subj:t?t.subj:'',taskId:t?t.id:'',body:'',media:[],from:t?t.id:''};openSheet('note',noteForm())},
 openNote:id=>{N={...S.notes.find(n=>n.id===id)};N.body=N.body||'';N.media=[...(N.media||[])];openSheet('note',noteForm())},
 saveNote:()=>{if(!N.title.trim())return toast('Escribe un título');const t=S.tasks.find(x=>x.id===N.taskId);
  const d={title:N.title.trim(),taskId:N.taskId||'',subj:t?t.subj:N.subj||'',body:N.body,media:N.media};
  if(N.id)Object.assign(S.notes.find(n=>n.id===N.id),d);else S.notes.push({id:uid(),uid:S.session,...d});
  save();const f=N.from;render();toast('Apunte guardado');if(f)A.openTask(f);else closeSheet()},
 delNote:id=>{if(!confirm('¿Eliminar este apunte?'))return;S.notes=S.notes.filter(n=>n.id!==id);save();closeSheet();render()},
 fmt:(_,v)=>document.execCommand(v),
 pick:(_,v)=>$({img:'#fi',vid:'#fv',cam:'#fc',file:'#ff'}[v]).click(),
 rmMedia:id=>{const d=D();d.media=d.media.filter(m=>m.id!==id);$('#mp').innerHTML=mediaGrid(d.media,true)},
 view:id=>{const m=[...dm(),...S.tasks.flatMap(t=>t.media),...S.notes.flatMap(n=>n.media||[])].find(x=>x.id===id);if(!m)return;
  $('#lb').innerHTML=`<button class="lx" data-a="lbx">${ic('x')}</button>${m.kind==='img'?`<img src="${urlOf(m)}" alt="">`:`<video src="${urlOf(m)}" controls autoplay playsinline></video>`}`;$('#lb').hidden=false},
 addTag:()=>{const i=$('#tagIn'),v=i.value.trim().replace(/^#/,'');if(v&&!F.tags.includes(v)){F.tags.push(v);$('#tg').innerHTML=tagsH()}i.value=''},
 rmTag:(_,v)=>{F.tags.splice(+v,1);$('#tg').innerHTML=tagsH()},
 addSubj:()=>{const v=$('#ns2').value.trim(),u=me();if(v&&!u.subjects.includes(v)){u.subjects.push(v);save();render()}},
 rmSubj:(_,v)=>{me().subjects.splice(+v,1);save();render()}
};
document.addEventListener('click',e=>{if(e.target.id==='lb')return A.lbx();if(e.target.id==='pop')return A.closePop();
 const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.id,b.dataset.v)});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;
 if(t.id==='ed'){if(kind==='note')N.body=t.innerHTML;else if(F)F.desc=t.innerHTML;return}
 if(!f)return;
 if(f==='fq'){fil.q=t.value;$('#tl').innerHTML=taskList();return}
 if(f==='nq'){nq=t.value;$('#nl').innerHTML=noteList();return}
 if(f==='dmin'||f==='dmax'){const v=+t.value;if(f==='dmin'){fil.dmin=Math.min(v,fil.dmax);t.value=fil.dmin}else{fil.dmax=Math.max(v,fil.dmin);t.value=fil.dmax}updDual();$('#tl').innerHTML=taskList();return}
 const d=D();if(!d)return;d[f]=t.type==='range'?+t.value:t.value;
 if(f==='diff'){$('#dv').textContent=dvT(+t.value);updBanner()}
 if(f==='due')updBanner();
 if(f==='taskId'){const k=S.tasks.find(x=>x.id===t.value);if(k)d.subj=k.subj;$('#ns').hidden=!!t.value}});
document.addEventListener('change',e=>{const t=e.target;if(t.type!=='file'||(kind!=='task'&&kind!=='note'))return;const d=D();
 [...t.files].forEach(f=>d.media.push({id:uid(),name:f.name||'archivo',kind:f.type.startsWith('image')?'img':f.type.startsWith('video')?'vid':'file',blob:f}));t.value='';$('#mp').innerHTML=mediaGrid(d.media,true)});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='tagIn'){e.preventDefault();A.addTag()}else if(['ae','ap','an','as'].includes(e.target.id))A.auth()});
document.addEventListener('paste',e=>{if(e.target.id==='ed'){e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))}});
(async()=>{try{const s=await DB.get();if(s){S={...S,...s};S.notes=S.notes.filter(n=>!n.auto)}}catch(_){}apply();
 if(sb){sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){am='recover';S.session=null;render()}});
  const{data}=await sb.auth.getSession();
  if(isRec){am='recover';S.session=null;return render()}
  if(data.session)return setUser(data.session.user);
  if(S.session){S.last=S.session;S.session=null;if(!S.dirty){S.users=[];S.tasks=[];S.notes=[]}}
 }else S.session=null;
 render()})();
</script></body></html>
